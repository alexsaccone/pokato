[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokato"
version = "0.1.0"
description = "A local, screen-reading Texas Hold'em practice coach"
requires-python = ">=3.10"
dependencies = ["Pillow>=11.2,<13"]

[tool.setuptools.packages.find]
where = ["src"]
