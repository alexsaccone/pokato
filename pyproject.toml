[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokato"
version = "0.6.1"
description = "A local, screen-reading Texas Hold'em practice coach"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.2,<13", "opencv-python-headless==4.13.0.92", "rapidocr==3.10.0", "onnxruntime==1.24.4"]

[project.optional-dependencies]
build = ["PyInstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokato = ["assets/*.png"]
