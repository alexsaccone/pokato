[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokato"
version = "0.5.1"
description = "A local, screen-reading Texas Hold'em practice coach"
requires-python = ">=3.10"
dependencies = ["Pillow>=11.2,<13", "opencv-python-headless==4.13.0.92"]

[project.optional-dependencies]
build = ["PyInstaller==6.22.3"]

[tool.setuptools.packages.find]
where = ["src"]
